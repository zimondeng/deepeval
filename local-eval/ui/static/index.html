<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepEval local console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar"><div><p class="eyebrow">LOCAL EVALUATION</p><h1>System one console</h1></div><span id="connection" class="status">Ready</span></header>
  <main>
    <form id="config-form">
      <section id="model" class="card"><h2>Model</h2><label>Jev base URL<input name="jev.base_url" type="url" value="https://emrank.tech"></label><label>Model<input name="jev.model" value="typesafe/jev-1.14.0"></label><label>Jev API key<input name="jev.api_key" type="password" autocomplete="off"></label></section>
      <section id="scope" class="card"><h2>Evaluation scope</h2><label>Scope<select name="evaluation.scope"><option value="e2e">E2E</option><option value="component">Component</option></select></label><label>Threshold<input name="evaluation.threshold" type="number" min="0" max="1" step=".01" value=".5"></label></section>
      <section id="dataset" class="card"><h2>Dataset</h2><label>JSONL path<input name="dataset.path" required></label><p class="hint">Only files under the local evaluation directory are accepted.</p></section>
      <section id="questions" class="card"><h2>Questions</h2><label>Question text<textarea name="question.text" required>The answer is useful.</textarea></label><label>Type<select name="question.type"><option value="noul">Noul</option><option value="choice">Choice</option><option value="score">Score</option></select></label></section>
      <section id="target" class="card"><h2>Target system</h2><label>POST URL<input name="target.url" type="url" required></label><label>Body template<textarea name="target.body_template">{"input":"{{input}}"}</textarea></label></section>
      <section id="component" class="card"><h2>Component trace</h2><label>Trace JSON path<input name="component.trace_path"></label><label>Node IDs<input name="component.node_ids" placeholder="span-1, span-2"></label></section>
      <section class="card actions"><button type="submit">Validate and save</button><button id="preview" type="button" class="secondary">Preview JSON</button><button id="start" type="button">Start evaluation</button></section>
    </form>
    <section class="card"><h2>Run status</h2><div id="feedback" role="status" aria-live="polite">No run started.</div><pre id="config-preview" hidden></pre><a id="report-link" hidden>Download report</a></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
